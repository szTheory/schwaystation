# Nightly bench: 300,000 headless frames of the test card per platform, as
# trend data, never a gate (docs/testing.md, "Performance"). The runner
# reports its own frame-time percentiles and max_rss_kib. Reports go to job
# summaries and artifacts, never to commits. A failed night opens or updates
# the one open issue labelled nightly; a good night closes it. The vectors-full
# job replays all 55,000 public single-step vectors at their pin; it reports
# through the same issue and is not part of the CI required aggregate. The
  # fuzz job runs the executable loader and nine media libFuzzer targets for 60 seconds and reports the
# same way (docs/testing.md, "The loader fuzz target").
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail the run on purpose, to show the nightly issue being written"
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # provisional
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nightly_full: ${{ steps.route.outputs.nightly_full }}
      pbp_only: ${{ steps.route.outputs.pbp_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify pull request files
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          full=true
          pbp=false
          if [ "$EVENT" = pull_request ] && \
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > files.json; then
            if count=$(jq -r '[.[][] | if .status == "renamed" then "__renamed__", .previous_filename, .filename else .filename end] | length' files.json) &&
              [ "$count" -gt 0 ] && [ "$count" -lt 3000 ] &&
              paths=$(jq -r '.[][] | if .status == "renamed" then "__renamed__", .previous_filename, .filename else .filename end' files.json) &&
              routed=$(printf '%s\n' "$paths" | scripts/classify-changes.sh "$count"); then
              full=$(printf '%s\n' "$routed" | sed -n 's/^nightly_full=//p')
              pbp=$(printf '%s\n' "$routed" | sed -n 's/^pbp_only=//p')
              case "$full:$pbp" in true:false | false:true | false:false) ;; *) full=true; pbp=false ;; esac
            fi
          fi
          echo "nightly_full=$full" >> "$GITHUB_OUTPUT"
          echo "pbp_only=$pbp" >> "$GITHUB_OUTPUT"

  # The cheap changes job routes known PBP or documentation-only PRs without
  # charging unrelated PRs for the full scheduled workload.
  bench:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.nightly_full == 'true') }}
    name: bench (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3  # 3-minute floor; 2 x 62 s = 3 min (1 sample); [run 44237075704](https://github.com/szTheory/schwaystation/actions/runs/44237075704), provisional
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset perf
      # A report without the percentiles or the RSS line fails the job.
      - name: Bench 300,000 frames
        env:
          LABEL: ${{ matrix.runner }}
        run: |
          mkdir -p report
          build/perf/schwaystation-run --bench 300000 > report/bench.txt
          for key in p50_us p99.999_us max_us max_rss_kib; do
            grep -q "^$key [0-9]" report/bench.txt || { echo "bench: no $key line"; cat report/bench.txt; exit 1; }
          done
          { cat report/bench.txt; echo "runner $LABEL"; } > report/report.txt
          cat report/report.txt
          { echo "### bench $LABEL"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.runner }}
          path: report/report.txt
          if-no-files-found: error

  # The same bench under the pinned wasmtime, for the browser target. WASI
  # has no resident set size, so its max_rss_kib line reads 0.
  bench-wasm32:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.nightly_full == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 108 s = 4 min (1 sample); [run 44237075704](https://github.com/szTheory/schwaystation/actions/runs/44237075704), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      - name: Build the runner
        run: cmake --preset wasm32 && cmake --build --preset wasm32 --target schwaystation-run
      - name: Bench 300,000 frames
        run: |
          mkdir -p report
          build/pins/wasmtime/wasmtime run build/wasm32/schwaystation-run --bench 300000 > report/bench.txt
          { cat report/bench.txt; echo "runner wasm32-wasmtime"; } > report/report.txt
          cat report/report.txt
          { echo "### bench wasm32-wasmtime"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-wasm32
          path: report/report.txt
          if-no-files-found: error
      # After the upload, so a forced failure still leaves the night's data.
      - name: Forced failure
        if: inputs.force_failure
        run: exit 1

  # The full public vectors (docs/testing.md, "The full vectors"): fetches the
  # 55 pinned blobs, checks each against its git SHA-1, then runs the nightly
  # preset. Nothing is cached or uploaded.
  vectors-full:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.nightly_full == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 40 s = 2 min (1 sample); [run 44237075704](https://github.com/szTheory/schwaystation/actions/runs/44237075704), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and check the pinned vector files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/sst
          rows=$(grep '^r3000-' pins.txt)
          while read -r name _ sha _; do
            file="build/sst/${name#r3000-}.json.bin"
            gh api "repos/SingleStepTests/r3000/git/blobs/$sha" -H 'Accept: application/vnd.github.raw' > "$file"
            got=$(git hash-object "$file")
            [ "$got" = "$sha" ] || { echo "vectors-full: $file hashes to $got, pins.txt has $sha"; exit 1; }
          done <<< "$rows"
      - run: cmake --workflow --preset nightly
      - run: cmake -DJUNIT=build/nightly/junit.xml -DINVENTORY=tests/inventory/nightly.txt -P tests/cmake/check_junit.cmake

  # Each parser/device campaign starts from checked replay seeds for 60 seconds.
  # A crash fails the job, so the rolling issue names
  # it; nothing is blocked. The crash files are kept for minimising.
  fuzz:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.nightly_full == 'true' || needs.changes.outputs.pbp_only == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # Twice the slowest recent matching successful run (7m03s = 14m06s), rounded up; [run 44190163638](https://github.com/szTheory/schwaystation/actions/runs/44190163638)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cheap source, inventory and route preflight
        run: |
          set -eu
          cmake -DMODE=pins -DDIR=.github/workflows -P tests/cmake/workflows.cmake
          cmake -DMODE=timeouts -DDIR=.github/workflows -P tests/cmake/workflows.cmake
          cmake -DROOT=. '-DPATTERNS=scripts/*.sh;tests/cmake/*.cmake;.githooks/*' -DLIMIT=3901 -P tests/cmake/line_budget.cmake
          for inventory in tests/inventory/*.txt tests/disc/inventory.txt tests/fuzz/inventory.txt tests/release/inventory.txt; do
            LC_ALL=C sort -cu "$inventory"
          done
          cmake -DCASE=disc_registration -DROOT=. -P tests/cmake/workflows.cmake
      # clang-21 and the media encoder's FFmpeg development packages may not be on the image.
      - name: Sanitizer and media-fixture dependencies
        run: |
          set -eu
          packages=(libclang-rt-21-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev)
          missing=false
          for package in "${packages[@]}"; do
            if ! dpkg -s "$package" > /dev/null 2>&1; then missing=true; break; fi
          done
          if [[ "$missing" == true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Build the uninstrumented CHD fixture generator
        if: needs.changes.outputs.pbp_only != 'true'
        run: |
          cmake --preset chd-tool
          cmake --build --preset chd-tool
          test -x build/chd-tool/tools/schwaystation-chd-tool
      - name: Build owned CHD and PBP baseline fixtures
        if: needs.changes.outputs.pbp_only != 'true'
        run: |
          set -eu
          cmake --preset fuzz
          cmake --build build/fuzz --target schwaystation-disc-fixtures schwaystation-pbp-fixtures schwaystation-legacy-disc-fixtures schwaystation-test-disc-legacy
          cmake -DCHD_TOOL=build/chd-tool/tools/schwaystation-chd-tool \
            -DCUE=build/fuzz/fixtures/disc_boot.cue \
            -DOUTPUT_CHD=build/fuzz/fixtures/disc_boot.chd \
            -DMANIFEST=build/fuzz/tests/disc_boot.chd.manifest \
            -P cmake/CHDFixtures.cmake
      - name: Configure PBP-only sanitizer targets
        if: needs.changes.outputs.pbp_only == 'true'
        run: cmake --preset fuzz -DSCHWAYSTATION_CHD=OFF
      - name: Build sanitizer targets
        env:
          PBP_ONLY: ${{ needs.changes.outputs.pbp_only }}
        run: |
          if [[ "$PBP_ONLY" == 'true' ]]; then
            cmake --build build/fuzz --target schwaystation-fuzz-pbp schwaystation-fuzz-pbp-replay schwaystation-pbp-fixtures
          else
            cmake --build --preset fuzz
            cmake --build build/fuzz --target schwaystation-test-disc-media
          fi
      - name: Verify ECM and CCD fixture and replay closure
        if: needs.changes.outputs.pbp_only != 'true'
        run: |
          set -eu
          for fixture in \
            build/fuzz/fixtures/disc_boot_legacy_literal.ecm \
            build/fuzz/fixtures/disc_boot_legacy_modeled.ecm \
            build/fuzz/fixtures/disc_boot_legacy.ccd \
            build/fuzz/fixtures/disc_boot_legacy.img \
            build/fuzz/fixtures/disc_boot_legacy.sub; do
            test -s "$fixture"
          done
          ctest --test-dir build/fuzz --no-tests=error --output-on-failure \
            -R '^disc[.]image[.]legacy_(preflight|parity)$|^fuzz[.]regress[.](ecm|ccd|chd[.]seed_corpus)$'
      - name: Check media seeds and run bounded campaigns
        env:
          PBP_ONLY: ${{ needs.changes.outputs.pbp_only }}
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -eu
          mkdir -p build/fuzz/corpus build/fuzz/crash
          if [[ "$PBP_ONLY" != 'true' ]]; then
            build/fuzz/tests/schwaystation-fuzz-exe-replay --write build/fuzz/corpus
            files=$(find build/fuzz/corpus -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')
            test "$files" -eq 42
            subsystems=(cue cnf m3u cdrom chd mdec pbp ecm ccd)
            expected=(5 5 7 15 12 6 14 10 10)
            max_lengths=(65536 4096 65536 16384 16384 262144 256 2101249 65536)
          else
            subsystems=(pbp)
            expected=(14)
            max_lengths=(256)
          fi
          for i in "${!subsystems[@]}"; do
            name=${subsystems[$i]}
            corpus="build/fuzz/corpus/$name"
            crash="build/fuzz/crash/$name"
            mkdir -p "$corpus" "$crash"
            seed_output=$("build/fuzz/tests/schwaystation-fuzz-$name-replay" --write "$corpus")
            files=$(find "$corpus" -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')
            test "$files" -eq "${expected[$i]}"
            [[ "$seed_output" == *"wrote ${expected[$i]} seeds"* ]]
            if [[ "$name" == ecm ]]; then
              seed_cap=2099201
              seed_fixtures=disc_boot_legacy_literal.ecm,disc_boot_legacy_modeled.ecm
              seed_names=(valid_literal valid_modeled bad_magic varint_overflow record_limit decoded_extent modeled_type1 bad_terminator bad_edc truncated_tail)
            elif [[ "$name" == ccd ]]; then
              seed_cap=65541
              seed_fixtures=disc_boot_legacy.ccd,disc_boot_legacy.img,disc_boot_legacy.sub
              seed_names=(valid_sub_transpose duplicate_field unsupported_session duplicate_mode plba_index_conflict missing_image short_image short_sub companion_scope valid_repeat)
            else
              continue
            fi
            [[ "$seed_output" == *"seed_count=${expected[$i]} file_cap=$seed_cap fixtures=$seed_fixtures"* ]]
            for seed_name in "${seed_names[@]}"; do
              seed_file="$corpus/$seed_name.exe"
              test -s "$seed_file"
              seed_bytes=$(wc -c < "$seed_file" | tr -d ' ')
              test "$seed_bytes" -le "$seed_cap"
            done
          done
          if [[ "$PBP_ONLY" != 'true' ]]; then
            rc=0
            build/fuzz/tests/schwaystation-fuzz-exe -max_total_time=60 -timeout=20 -max_len=2099200 \
              -artifact_prefix=build/fuzz/crash/ build/fuzz/corpus > build/fuzz/log.txt 2>&1 || rc=$?
            tail -n 30 build/fuzz/log.txt
            { echo '### fuzz'; echo '```'; tail -n 3 build/fuzz/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            test "$rc" -eq 0
          fi
          for i in "${!subsystems[@]}"; do
            name=${subsystems[$i]}
            corpus="build/fuzz/corpus/$name"
            crash="build/fuzz/crash/$name"
            rc=0
            "build/fuzz/tests/schwaystation-fuzz-$name" -max_total_time=60 -timeout=20 \
              -max_len="${max_lengths[$i]}" -artifact_prefix="$crash/" "$corpus" \
              > "build/fuzz/$name.log" 2>&1 || rc=$?
            tail -n 20 "build/fuzz/$name.log"
            { echo "### $name fuzz"; echo '```'; tail -n 3 "build/fuzz/$name.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            test "$rc" -eq 0
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz/crash
          if-no-files-found: ignore

  # Decides from the jobs' results, never from a piped exit status: the
  # default shell has no pipefail.
  report:
    needs: [bench, bench-wasm32, vectors-full, fuzz]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 5 s = 1 min (1 sample); [run 44237075704](https://github.com/szTheory/schwaystation/actions/runs/44237075704), provisional
    permissions:
      issues: write
    steps:
      - name: Rolling nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          results=$(jq -r 'to_entries | map("\(.key): \(.value.result)") | join(", ")' <<< "$NEEDS")
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "nightly: success ($results)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Passed ($EVENT) at $SHA: $url"
            fi
            exit 0
          fi
          echo "nightly: failure ($results)"
          body="Failed ($EVENT) at $SHA: $url

          Jobs: $results"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly failed" --label nightly --body "$body"
          fi
