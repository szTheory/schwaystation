# Nightly bench: 300,000 headless frames of the test card per platform, as
# trend data, never a gate (docs/testing.md, "Performance"). The runner
# reports its own frame-time percentiles and max_rss_kib. Reports go to job
# summaries and artifacts, never to commits. A failed night opens or updates
# the one open issue labelled nightly; a good night closes it. The vectors-full
# job replays all 55,000 public single-step vectors at their pin; it reports
# through the same issue and is not part of the CI required aggregate. The
# fuzz job runs the loader's libFuzzer target for 60 seconds and reports the
# same way (docs/testing.md, "The loader fuzz target").
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail the run on purpose, to show the nightly issue being written"
        type: boolean
        default: false
  # A change to the bench or this file runs the bench jobs on its pull
  # request; the report job writes no issue for pull requests.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - cmake/SPUReferences.cmake
      - pins.txt
      - runner/bench.c
      - runner/bench.h
      - runner/clock.c
      - runner/clock.h
      - runner/rss.c
      - runner/rss.h
      - tests/nightly/inventory.txt
      - tests/nightly/tests.cmake
      - tests/spu/reference.c

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: bench (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3  # 2 x 66 s (bench macos-15), slowest of 3 runs, run 39457445780, provisional
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --workflow --preset perf
      # A report without the percentiles or the RSS line fails the job.
      - name: Bench 300,000 frames
        env:
          LABEL: ${{ matrix.runner }}
        run: |
          mkdir -p report
          build/perf/schwaystation-run --bench 300000 > report/bench.txt
          for key in p50_us p99.999_us max_us max_rss_kib; do
            grep -q "^$key [0-9]" report/bench.txt || { echo "bench: no $key line"; cat report/bench.txt; exit 1; }
          done
          { cat report/bench.txt; echo "runner $LABEL"; } > report/report.txt
          cat report/report.txt
          { echo "### bench $LABEL"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.runner }}
          path: report/report.txt
          if-no-files-found: error

  # The same bench under the pinned wasmtime, for the browser target. WASI
  # has no resident set size, so its max_rss_kib line reads 0.
  bench-wasm32:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 2 x 126 s (bench-wasm32), slowest of 2 runs, run 39455724030, provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      - name: Build the runner
        run: cmake --preset wasm32 && cmake --build --preset wasm32 --target schwaystation-run
      - name: Bench 300,000 frames
        run: |
          mkdir -p report
          build/pins/wasmtime/wasmtime run build/wasm32/schwaystation-run --bench 300000 > report/bench.txt
          { cat report/bench.txt; echo "runner wasm32-wasmtime"; } > report/report.txt
          cat report/report.txt
          { echo "### bench wasm32-wasmtime"; echo '```'; cat report/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-wasm32
          path: report/report.txt
          if-no-files-found: error
      # After the upload, so a forced failure still leaves the night's data.
      - name: Forced failure
        if: inputs.force_failure
        run: exit 1

  # The full public vectors (docs/testing.md, "The full vectors"): fetches the
  # 55 pinned blobs, checks each against its git SHA-1, then runs the nightly
  # preset. Nothing is cached or uploaded.
  vectors-full:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 49 s (vectors-full), slowest of 6 runs, run 42720996208
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and check the pinned vector files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/sst
          rows=$(grep '^r3000-' pins.txt)
          while read -r name _ sha _; do
            file="build/sst/${name#r3000-}.json.bin"
            gh api "repos/SingleStepTests/r3000/git/blobs/$sha" -H 'Accept: application/vnd.github.raw' > "$file"
            got=$(git hash-object "$file")
            [ "$got" = "$sha" ] || { echo "vectors-full: $file hashes to $got, pins.txt has $sha"; exit 1; }
          done <<< "$rows"
      - run: cmake --workflow --preset nightly
      - run: cmake -DJUNIT=build/nightly/junit.xml -DINVENTORY=tests/inventory/nightly.txt -P tests/cmake/check_junit.cmake

  # The loader fuzz campaign: the `fuzz` preset's binary on the replay's
  # seeds for 60 seconds. A crash fails the job, so the rolling issue names
  # it; nothing is blocked. The crash files are kept for minimising.
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (apt); 2 x 81 s (fuzz), slowest of 5 runs, run 42720996208
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-21 is on the image; its sanitizer and libFuzzer runtimes may not be.
      - name: Sanitizer runtimes
        run: dpkg -s libclang-rt-21-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-rt-21-dev; }
      - run: cmake --workflow --preset fuzz
      - name: Fuzz the loader for 60 seconds
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/crash
          build/fuzz/tests/schwaystation-fuzz-exe-replay --write build/fuzz/corpus
          rc=0
          build/fuzz/tests/schwaystation-fuzz-exe -max_total_time=60 -timeout=20 -max_len=2099200 \
            -artifact_prefix=build/fuzz/crash/ build/fuzz/corpus > build/fuzz/log.txt 2>&1 || rc=$?
          tail -n 30 build/fuzz/log.txt
          { echo '### fuzz'; echo '```'; tail -n 3 build/fuzz/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz/crash
          if-no-files-found: ignore

  # Decides from the jobs' results, never from a piped exit status: the
  # default shell has no pipefail.
  report:
    needs: [bench, bench-wasm32, vectors-full, fuzz]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (roll-up); 2 x 8 s (report), slowest of 2 runs, run 39457820699, provisional
    permissions:
      issues: write
    steps:
      - name: Rolling nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          results=$(jq -r 'to_entries | map("\(.key): \(.value.result)") | join(", ")' <<< "$NEEDS")
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "nightly: success ($results)"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Passed ($EVENT) at $SHA: $url"
            fi
            exit 0
          fi
          echo "nightly: failure ($results)"
          body="Failed ($EVENT) at $SHA: $url

          Jobs: $results"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly failed" --label nightly --body "$body"
          fi
