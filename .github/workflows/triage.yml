name: Weekly triage

on:
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute setup/API/upload floor; provisional, unsampled
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect sanitized triage metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sh scripts/triage-report.sh collect triage.json
      - name: Upload triage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-triage
          path: triage.json
          if-no-files-found: error
          retention-days: 7
