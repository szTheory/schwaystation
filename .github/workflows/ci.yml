# Continuous integration. Build jobs use the local CMake workflows and check that every
# expected test ran. The GPU reference lane configures only its selected GPU tests.
# The ruleset requires one check, `CI required`; docs/testing.md describes the jobs.
# Every timeout below is provisional until this repository's own runs measure it.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      control_ref:
        description: "Optional commit with which to compare GPU-motion performance"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit to build; empty builds the caller's commit"
        type: string
        required: false
        default: ""

# No trigger-level path filter: a workflow skipped by paths leaves the
# required check pending. The changes job decides what runs instead.

permissions:
  contents: read

# Armed after zero-spread controls on the v0.1.0 commit, runs 40939706087 and
# 40939709809. Pull requests fail above +1.00 % per fixture.
env:
  SCHWAYSTATION_PERF_MODE: gate
  # A published and deleted tag name can never be reused under immutable
  # releases, so every rehearsal attempt gets its own.
  REHEARSAL_TAG: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

# Only a pull request's runs supersede each other, so every main commit keeps
# a result. The workflow name is part of the group because a call from
# release.yml sees the caller's context: its run must not queue behind the
# push run on the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # heavy=false only for a pull request or direct main push whose complete
  # changed-path list is non-empty and entirely under .planning/.
  # release_inputs=true when a path the release pipeline reads changed.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 11 s (2 samples), changes; [run 44336756139](https://github.com/szTheory/schwaystation/actions/runs/44336756139), provisional
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      release_inputs: ${{ steps.classify.outputs.release_inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      # A failed listing adds a path outside .planning/, so it counts as heavy;
      # CHANGED catches a listing cut short at the API's 3000 files.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CALL_REF: ${{ inputs.ref || '' }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # CI_CLASSIFIER_TEST_BEGIN
          fail_closed() {
            printf 'heavy=true\nrelease_inputs=true\n' | tee -a "$GITHUB_OUTPUT"
          }
          is_commit_id() {
            [ "${#1}" -eq 40 ] && case "$1" in
              *[!0123456789abcdef]* | 0000000000000000000000000000000000000000) return 1 ;;
              *) return 0 ;;
            esac
          }
          valid_file_count() {
            case "$1" in '' | *[!0123456789]*) return 1 ;; esac
            [ "$1" -gt 0 ] && [ "$1" -le 3000 ]
          }
          pr_metadata() {
            gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" | jq -ce '{number:.number,login:(.user.login // ""),type:(.user.type // ""),head_ref:(.head.ref // ""),head_sha:(.head.sha // ""),head_repo:(.head.repo.full_name // ""),base_ref:(.base.ref // ""),base_sha:(.base.sha // ""),base_repo:(.base.repo.full_name // ""),changed_files:.changed_files}'
          }
          pr_matches_event() {
            printf '%s\n' "$1" | jq -e --argjson number "$NUMBER" --arg login "$PR_AUTHOR" \
              --arg type "$PR_AUTHOR_TYPE" --arg href "$PR_HEAD_REF" --arg hsha "$PR_HEAD_SHA" \
              --arg hrepo "$PR_HEAD_REPO" --arg bref "$PR_BASE_REF" --arg bsha "$PR_BASE_SHA" \
              --arg brepo "$PR_BASE_REPO" --argjson changed "$CHANGED" \
              '.number == $number and .login == $login and .type == $type and .head_ref == $href and .head_sha == $hsha and .head_repo == $hrepo and .base_ref == $bref and .base_sha == $bsha and .base_repo == $brepo and .changed_files == $changed' >/dev/null
          }
          if [ -n "$NUMBER" ]; then
            if ! valid_file_count "$CHANGED" || ! is_commit_id "$PR_HEAD_SHA" || ! is_commit_id "$PR_BASE_SHA"; then
              fail_closed
              exit 0
            fi
            if ! pr_before=$(pr_metadata) || ! pr_matches_event "$pr_before"; then
              fail_closed
              exit 0
            fi
            if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files?per_page=100" | jq -s -ce 'if length > 0 and all(.[]; type == "array") then add else error("incomplete pages") end'); then
              fail_closed
              exit 0
            fi
            if ! file_count=$(printf '%s\n' "$files" | jq -er '
              def safe_path:
                type == "string" and length > 0 and length <= 4096 and
                (startswith("/") | not) and (contains("\\") | not) and
                (explode | all(.[]; . >= 32 and (. < 127 or . > 159))) and
                (split("/") | all(.[]; . != "" and . != "." and . != ".."));
              if type != "array" or length == 0 or length > 3000 then error("file count") else
                if all(.[]; . as $f |
                  ($f.filename | safe_path) and
                  ($f.status as $s | ($s | type) == "string" and (["added","removed","modified","renamed","copied","changed","unchanged"] | index($s) != null)) and
                  ($f.previous_filename == null or ($f.previous_filename | safe_path)) and
                  ($f.status != "renamed" or ($f.previous_filename | type) == "string"))
                  then length as $n | ([.[].filename] | unique | length) as $unique |
                    if $n == $unique then $n else error("duplicate filename") end
                  else error("untrusted path record") end
              end'); then
              fail_closed
              exit 0
            fi
            if [ "$file_count" -ne "$CHANGED" ] || ! valid_file_count "$file_count"; then
              fail_closed
              exit 0
            fi
            if ! pr_after=$(pr_metadata) || [ "$pr_before" != "$pr_after" ] || ! pr_matches_event "$pr_after"; then
              fail_closed
              exit 0
            fi
            release_metadata=
            if [ "$PR_AUTHOR" = 'schwaystation-release[bot]' ] && [ "$PR_AUTHOR_TYPE" = Bot ] && \
              [ "$PR_HEAD_REF" = release-please--branches--main ] && [ "$PR_BASE_REF" = main ] && \
              [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$PR_BASE_REPO" = "$GITHUB_REPOSITORY" ] && \
              jq -e 'length == 3 and all(.[]; .status == "modified" and .previous_filename == null) and ([.[].filename] | sort) == [".release-please-manifest.json","CHANGELOG.md","version.txt"]' <<< "$files" >/dev/null; then
              release_metadata=release-metadata
            fi
            paths=$(jq -r '.[] | .filename, (.previous_filename // empty)' <<< "$files")
            printf '%s\n' "$paths" | sh scripts/classify-changes.sh "$file_count" "$release_metadata" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ] || [ -n "$CALL_REF" ]; then
            fail_closed
            exit 0
          fi
          if ! is_commit_id "$BEFORE" || ! is_commit_id "$AFTER"; then
            fail_closed
            exit 0
          fi
          checked_out=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD 2>/dev/null) || {
            fail_closed
            exit 0
          }
          if [ "$checked_out" != "$AFTER" ]; then
            fail_closed
            exit 0
          fi
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n') || {
              fail_closed
              exit 0
            }
            if ! git -C "$GITHUB_WORKSPACE" -c "http.extraheader=AUTHORIZATION: basic $auth" \
              fetch --no-tags --depth=1 origin "$BEFORE" >/dev/null 2>&1; then
              fail_closed
              exit 0
            fi
          fi
          if ! paths=$(git -C "$GITHUB_WORKSPACE" -c core.quotePath=true \
            diff --no-renames --name-only "$BEFORE" "$AFTER" --); then
            fail_closed
            exit 0
          fi
          if [ -z "$paths" ]; then
            fail_closed
            exit 0
          fi
          count=$(printf '%s\n' "$paths" | wc -l | tr -d '[:space:]')
          case "$count" in
            '' | *[!0123456789]*) fail_closed; exit 0 ;;
          esac
          if [ "$count" -gt 3000 ]; then
            fail_closed
            exit 0
          fi
          printf '%s\n' "$paths" | sh scripts/classify-changes.sh "$count" | tee -a "$GITHUB_OUTPUT"
          # CI_CLASSIFIER_TEST_END

  # Required renderer oracle: fetch the pinned captures and three source logs,
  # then run only the GPU reference tests. The CPU vector corpus stays nightly.
  gpu-reference:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 41 s = 2 min (2 samples); [run 44253375502](https://github.com/szTheory/schwaystation/actions/runs/44253375502), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Configure the GPU reference inventory
        run: >-
          cmake -S . -B build/gpu-reference -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DSCHWAYSTATION_INVENTORY=nightly -DSCHWAYSTATION_FIXTURES=OFF
          -DSCHWAYSTATION_GPU_REFERENCE_ONLY=ON
      - name: Build the runner and GPU judge
        run: cmake --build build/gpu-reference --target schwaystation-run schwaystation-test-gpu-reference --parallel 2
      - name: Run the pinned GPU oracles
        run: >-
          ctest --test-dir build/gpu-reference --output-on-failure --no-tests=error
          --output-junit junit.xml -R '^gpu[.]reference[.]'
      - name: Every GPU reference ran
        run: >-
          cmake -DJUNIT=build/gpu-reference/junit.xml -DINVENTORY=tests/inventory/nightly.txt
          -DLABELS=gpu -P tests/cmake/check_junit.cmake

  # Build once in this run, then hand the digest-checked image to every build
  # consumer through a short-retention Actions artifact (never a cache).
  openbios:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 35 s = 2 min (2 samples); [run 44307395327](https://github.com/szTheory/schwaystation/actions/runs/44307395327), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Build and verify pinned OpenBIOS
        env:
          OPENBIOS_PIN: 9db6d88d23c4da7a39b1a4b9729f1e5fff80dec9
        run: |
          set -eu
          source_dir="$RUNNER_TEMP/nugget"
          archive_dir="$RUNNER_TEMP/openbios-archive"
          toolchain_dir="$RUNNER_TEMP/openbios-toolchain"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/pcsx-redux/nugget.git "$source_dir"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$OPENBIOS_PIN"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$OPENBIOS_PIN"
          mkdir -p "$archive_dir" "$toolchain_dir" build/openbios
          sh scripts/fetch-pin.sh gcc-mipsel-none-elf-linux "$archive_dir"
          toolchain_zip=$(find "$archive_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$toolchain_zip"
          unzip -t "$toolchain_zip" > /dev/null
          unzip -q "$toolchain_zip" -d "$toolchain_dir"
          test -x "$toolchain_dir/bin/mipsel-none-elf-gcc"
          PATH="$toolchain_dir/bin:$PATH" make -C "$source_dir/openbios" -j2 \
            BUILD=Release BOARD=psx BOOT=rom OPENBIOS_SHELL=shell
          cmake "-DOPENBIOS_INPUT=$source_dir/openbios/openbios.bin" \
            -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
          cp "$source_dir/openbios/openbios.bin" build/openbios/openbios.bin
          PATH="$toolchain_dir/bin:$PATH" make -C "$source_dir/openbios" clean
          PATH="$toolchain_dir/bin:$PATH" make -C "$source_dir/openbios" -j2 \
            BUILD=Release BOARD=psx BOOT=rom OPENBIOS_SHELL=shell BOOT_MODE=fast
          cmake "-DOPENBIOS_INPUT=$source_dir/openbios/openbios.bin" \
            -DEXPECTED_FILE=tests/built/fast-expected.txt -P cmake/OpenBIOS.cmake
          cp "$source_dir/openbios/openbios.bin" build/openbios/openbios-fast.bin
      - name: Build pinned media encoder and generate owned media
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libavformat-dev libavcodec-dev \
            libavutil-dev libswresample-dev libswscale-dev
          cmake -DOUTPUT="$GITHUB_WORKSPACE/build/psxavenc" \
            -DBUILD_ROOT="$GITHUB_WORKSPACE/build/pins/psxavenc" -P cmake/Psxavenc.cmake
          python3 tools/gen_disc.py --output-dir build/disc-media --encoder build/psxavenc/psxavenc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbios-handoff
          path: build/openbios/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disc-media-handoff
          path: build/disc-media/
          retention-days: 1
          if-no-files-found: error

  # The image has git and jq; configure finds them.
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 3  # 2 x 62 s = 3 min (2 samples); [run 44336756139](https://github.com/szTheory/schwaystation/actions/runs/44336756139), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset hygiene
      - name: Every test ran
        run: cmake -DJUNIT=build/hygiene/junit.xml -DINVENTORY=tests/inventory/hygiene.txt -P tests/cmake/check_junit.cmake

  # The squash commit takes the pull request's title and body, so the check
  # reads them live: an edit reruns it (the edited trigger) without a commit.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # provisional; 0 comparable samples, use the next ordinary successful or failed attempt.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Conventional Commit title, no skip token
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            sh scripts/check-title.sh "$title"

  build:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30  # 2 x 872 s = 30 min (2 samples); slowest build matrix leg macos-x64; [run 44307395327](https://github.com/szTheory/schwaystation/actions/runs/44307395327), provisional
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, preset: ci, os: linux, arch: x64 }
          - { runner: ubuntu-26.04-arm, preset: ci, os: linux, arch: arm64 }
          - { runner: macos-15, preset: ci, os: macos, arch: arm64 }
          - { runner: macos-15-intel, preset: ci, os: macos, arch: x64 }
          - { runner: windows-2025, preset: ci-msvc, os: windows, arch: x64 }
          - { runner: windows-11-arm, preset: ci-msvc, os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: compat-base
          sparse-checkout: |
            scripts/compat-ratchet.sh
            tests/cmake/compat-ratchet.cmake
            tests/compat/ledger.csv
          sparse-checkout-cone-mode: false
      - name: Preserve protected base checkout for ratchet
        if: github.event_name == 'pull_request'
        env:
          COMPAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          protected_base="$RUNNER_TEMP/compat-base"
          cmake -E copy_directory "$GITHUB_WORKSPACE/compat-base" "$protected_base"
          test "$(git -C "$protected_base" rev-parse --verify HEAD)" = "$COMPAT_BASE_SHA"
          printf 'COMPAT_BASE_DIR=%s\n' "$protected_base" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/${{ matrix.preset }}/openbios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disc-media-handoff
          path: build/${{ matrix.preset }}/disc-media
      - name: Verify run-local OpenBIOS before consumers
        run: |
          cmake -DOPENBIOS_INPUT=build/${{ matrix.preset }}/openbios/openbios.bin \
            -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
          cmake -DOPENBIOS_INPUT=build/${{ matrix.preset }}/openbios/openbios-fast.bin \
            -DEXPECTED_FILE=tests/built/fast-expected.txt -P cmake/OpenBIOS.cmake
      # The MSVC developer environment for the runner's own architecture,
      # without a third-party action.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV } }
      - name: Stable state size preflight
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        env:
          SCHWAYSTATION_DISC_MEDIA_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/disc-media
        run: |
          set -eu
          cmake --preset ci
          cmake --build build/ci --target schwaystation-test-state
          # QUALITY_STATE_BYTES_BEGIN
          state_output=$("${STATE_TEST_BINARY:-build/ci/tests/schwaystation-test-state}" state.stable_bytes)
          printf '%s\n' "$state_output"
          state_count=$(printf '%s\n' "$state_output" | grep -c '^state_bytes=' || true)
          if [ "$state_count" -ne 1 ]; then printf '%s\n' 'quality: state_bytes must occur exactly once' >&2; exit 1; fi
          state_line=$(printf '%s\n' "$state_output" | grep '^state_bytes=')
          state_bytes=${state_line#state_bytes=}
          case "$state_bytes" in ''|0|0*|*[!0123456789]*) printf '%s\n' 'quality: state_bytes must be a positive integer' >&2; exit 1;; esac
          cmake "-DQUALITY=${QUALITY_FILE:-quality.json}" -DMETRIC=state.bytes "-DMEASURED=$state_bytes" -P tests/cmake/quality.cmake
          # QUALITY_STATE_BYTES_END
      - name: Build, test, package
        env:
          COMPAT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SCHWAYSTATION_DISC_MEDIA_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/disc-media
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DEXCLUDE=release -P tests/cmake/check_junit.cmake
      - name: Every release test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit-release.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=release -P tests/cmake/check_junit.cmake
      # Compile the optional host once against this job's installed library;
      # it is not run or packaged. SDL2 comes from the runner or its OS repo.
      - name: Build the installed-library SDL2 example
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          set -eu
          if ! pkg-config --exists sdl2; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pkg-config libsdl2-compat-dev
          fi
          cmake --install build/${{ matrix.preset }} --prefix build/${{ matrix.preset }} --component library
          cmake -S examples/sdl2 -B build/example-sdl2 \
            -DCMAKE_PREFIX_PATH="$PWD/build/${{ matrix.preset }}" \
            -Dschwaystation_DIR="$PWD/build/${{ matrix.preset }}/lib/cmake/schwaystation"
          cmake --build build/example-sdl2 --parallel 2
      # The README line installs this leg's own libretro zip after checking
      # its checksum, and refuses a copy with one byte flipped.
      - name: README install line
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        run: |
          cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -P tests/cmake/install_line.cmake
          cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -DFLIP=1 -P tests/cmake/install_line.cmake
      # The commit these archives were built from; a release publishes only
      # archives that all record its own commit.
      - name: The commit built
        run: git rev-parse HEAD > build/${{ matrix.preset }}/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.preset }}/schwaystation-*.zip
            build/${{ matrix.preset }}/commit.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/hashes.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        with:
          name: pad-counter-fixture
          path: |
            build/${{ matrix.preset }}/fixtures/pad_counter.exe
            build/${{ matrix.preset }}/fixtures/spu_tone.exe
            build/${{ matrix.preset }}/fixtures/memcard_roundtrip.exe
          retention-days: 1
          if-no-files-found: error

  asan:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 38 # 2 x 1120 s = 38 min (2 samples); [run 44253375502](https://github.com/szTheory/schwaystation/actions/runs/44253375502), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/asan/openbios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disc-media-handoff
          path: build/asan/disc-media
      - name: Verify run-local OpenBIOS before consumers
        run: |
          cmake -DOPENBIOS_INPUT=build/asan/openbios/openbios.bin -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
          cmake -DOPENBIOS_INPUT=build/asan/openbios/openbios-fast.bin -DEXPECTED_FILE=tests/built/fast-expected.txt -P cmake/OpenBIOS.cmake
      # clang-21 is on the image; its sanitizer runtimes may not be.
      - name: Sanitizer runtimes
        run: dpkg -s libclang-rt-21-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-rt-21-dev; }
      - name: Build and test
        env:
          SCHWAYSTATION_DISC_MEDIA_DIR: ${{ github.workspace }}/build/asan/disc-media
        run: cmake --workflow --preset asan
      # The abi and release checks read binary shapes the instrumentation changes.
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/asan/junit.xml -DINVENTORY=tests/inventory/asan.txt
          "-DEXCLUDE=abi|release" -P tests/cmake/check_junit.cmake

  nofp:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: nofp (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3  # 3-minute floor; 2 x 27 s = 1 min (2 samples); [run 44253375502](https://github.com/szTheory/schwaystation/actions/runs/44253375502), provisional
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset nofp
      - name: Every test ran
        run: cmake -DJUNIT=build/nofp/junit.xml -DINVENTORY=tests/inventory/nofp.txt -P tests/cmake/check_junit.cmake

  # 32-bit big-endian PowerPC under qemu-ppc: label portable, and its
  # hashes.txt joins the comparison.
  be32:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 109 # 2 x 3243 s = 109 min (2 samples), slowest be32; [run 44253375502](https://github.com/szTheory/schwaystation/actions/runs/44253375502), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/be32/openbios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disc-media-handoff
          path: build/be32/disc-media
      - name: Verify run-local OpenBIOS before consumers
        run: |
          cmake -DOPENBIOS_INPUT=build/be32/openbios/openbios.bin -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
          cmake -DOPENBIOS_INPUT=build/be32/openbios/openbios-fast.bin -DEXPECTED_FILE=tests/built/fast-expected.txt -P cmake/OpenBIOS.cmake
      - name: Cross compiler and qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu g++-powerpc-linux-gnu qemu-user
      - name: Build and test
        env:
          SCHWAYSTATION_DISC_MEDIA_DIR: ${{ github.workspace }}/build/be32/disc-media
        run: cmake --workflow --preset be32
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/be32/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-be32
          path: build/be32/hashes.txt
          if-no-files-found: error

  # The same inputs give the same hashes everywhere: exactly eight files, the
  # six build legs, be32 and wasm32, byte-identical.
  hash-equality:
    needs: [changes, build, be32, wasm32]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 8 s = 1 min (2 samples); [run 44253375502](https://github.com/szTheory/schwaystation/actions/runs/44253375502), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          path: hashes
      - name: Hashes are byte-identical
        run: |
          files=$(printf '%s;' hashes/*/hashes.txt)
          cmake "-DFILES=${files%;}" -DCOUNT=8 -DMODE=compare -P tests/cmake/hashes.cmake

  # The WebAssembly lane participates in the same required hash comparison.
  wasm32:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 9  # 5-minute setup floor; 2 x 244 s = 9 min (2 samples); [run 44307395327](https://github.com/szTheory/schwaystation/actions/runs/44307395327), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/wasm32/openbios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disc-media-handoff
          path: build/wasm32/disc-media
      - name: Verify run-local OpenBIOS before consumers
        run: |
          cmake -DOPENBIOS_INPUT=build/wasm32/openbios/openbios.bin -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
          cmake -DOPENBIOS_INPUT=build/wasm32/openbios/openbios-fast.bin -DEXPECTED_FILE=tests/built/fast-expected.txt -P cmake/OpenBIOS.cmake
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      - name: Configure and build
        env:
          SCHWAYSTATION_DISC_MEDIA_DIR: ${{ github.workspace }}/build/wasm32/disc-media
        run: cmake --workflow --preset wasm32-build
      - name: Measure linked WASI module
        run: |
          # QUALITY_WASM_COMPARE_BEGIN
          cmake "-DQUALITY=${QUALITY_FILE:-quality.json}" -DMETRIC=size.wasm "-DARTIFACT=${WASM_MODULE:-build/wasm32/schwaystation-run}" -P tests/cmake/quality.cmake
          # QUALITY_WASM_COMPARE_END
      - name: WASI persistence preflight
        run: ctest --preset wasm32-preflight --output-on-failure
      - name: Portable tests
        run: ctest --preset wasm32 --output-on-failure
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/wasm32/junit.xml -DINVENTORY=tests/inventory/wasm32.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-wasm32
          path: build/wasm32/hashes.txt
          if-no-files-found: error

  # A real frontend shows the same frame the runner hashes: RetroArch from
  # the pinned DMG runs without content and boots the owned disc; each shot
  # equals the runner's same-frame PNG pixel for pixel. A hosted CI step runs on macOS.
  # The runner's frame number stays equal to RetroArch's frame count; if a
  # run ever shows a fixed one-frame offset, read the frame counter in the
  # uploaded screenshot and pin the runner's number here with a comment
  # saying so. A range of frames is never accepted.
  retroarch:
    needs: [changes, build, openbios]
    # Keep the host result when another build leg fails; the required aggregate still fails.
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' && needs.openbios.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 5  # 5-minute floor; 2 x 101 s = 4 min (2 samples); [run 44253375502](https://github.com/szTheory/schwaystation/actions/runs/44253375502), provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives-macos-arm64
          path: build/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pad-counter-fixture
          path: build/fixtures
      - name: Required RetroArch guests exist
        run: test -s build/fixtures/pad_counter.exe && test -s build/fixtures/spu_tone.exe && test -s build/fixtures/memcard_roundtrip.exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/ci/openbios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disc-media-handoff
          path: build/ci/disc-media
      - name: Core and runner from the build
        run: |
          unzip -q build/archives/schwaystation-libretro-macos-arm64.zip -d build/libretro
          unzip -q build/archives/schwaystation-runner-macos-arm64.zip -d build/runner
      - name: Build the owned disc with checked media
        env:
          SCHWAYSTATION_DISC_MEDIA_DIR: ${{ github.workspace }}/build/ci/disc-media
        run: |
          cmake --preset ci
          cmake --build --preset ci --target schwaystation-disc-fixtures
      # fetch-pin.sh checks the DMG's SHA-256 before anything opens it.
      - name: RetroArch 1.22.2 from the pinned DMG
        run: |
          scripts/fetch-pin.sh retroarch-dmg build/dmg
          hdiutil attach build/dmg/RetroArch_Metal.dmg -nobrowse -readonly -mountpoint build/mount
          ditto build/mount/RetroArch.app build/RetroArch.app
          hdiutil detach build/mount
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/RetroArch.app/Contents/Info.plist)
          echo "RetroArch $version"
          test "$version" = 1.22.2
      - name: RetroArch saves and resumes both cards
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra-cards"
          "-DSHOT=$PWD/build/frames/cards" -DPROBE_CONTENT=build/fixtures/memcard_roundtrip.exe
          -DMODE=cards -DFRAMES=120 -DVERIFY=tests/retroarch/verify.py -P tests/retroarch/run_retroarch.cmake
      - name: RetroArch runs the core with no content
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra" -DFRAMES=5
          "-DSHOT=$PWD/build/frames/shot.png" -P tests/retroarch/run_retroarch.cmake
      - name: The screenshot equals the runner's frame
        working-directory: build/frames
        run: |
          ../runner/bin/schwaystation-run --frames 5 --png 5:runner.png
          for f in runner shot; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          python3 ../../tests/retroarch/verify.py compare runner.bmp shot.bmp 320 240
          python3 ../../tests/retroarch/verify.py pixel-control shot.bmp 7 3
          python3 ../../tests/retroarch/verify.py dimension-control shot.bmp 319 240
      - name: Record and replay deterministic Cross input
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra-replay"
          "-DSHOT=$PWD/build/frames/replay" -DPROBE_CONTENT=build/fixtures/pad_counter.exe -DFRAMES=60
          -DVERIFY=tests/retroarch/verify.py -P tests/retroarch/run_retroarch.cmake
      - name: Boot spu_tone.exe under the stub
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra-spu-tone"
          "-DSHOT=$PWD/build/frames/spu-tone" -DPROBE_CONTENT=build/fixtures/spu_tone.exe -DFRAMES=60
          -DVERIFY=tests/retroarch/verify.py -P tests/retroarch/run_retroarch.cmake
      - name: Both RetroArch frames equal their runner references
        working-directory: build/frames
        run: |
          printf '%s\n' '1 p1=digital:.:128,128,128,128 p2=.' \
            '60 p1=digital:X:128,128,128,128 p2=.' > pad-counter.inputs
          ../runner/bin/schwaystation-run --exe ../fixtures/pad_counter.exe --frames 59 \
            --inputs pad-counter.inputs --png 59:runner59.png
          ../runner/bin/schwaystation-run --exe ../fixtures/pad_counter.exe --frames 60 \
            --inputs pad-counter.inputs --png 60:runner60.png
          test -d ../ra-replay/system && test -z "$(find ../ra-replay/system -mindepth 1 -print -quit)"
          for f in runner59 runner60 replay.59 replay.60; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          python3 ../../tests/retroarch/verify.py compare runner59.bmp replay.59.bmp 256 240
          python3 ../../tests/retroarch/verify.py compare runner60.bmp replay.60.bmp 256 240
          python3 ../../tests/retroarch/verify.py distinct replay.59.bmp replay.60.bmp
      - name: Tone video frames equal the runner
        working-directory: build/frames
        run: |
          ../runner/bin/schwaystation-run --exe ../fixtures/spu_tone.exe --frames 59 --png 59:spu-tone-runner59.png
          ../runner/bin/schwaystation-run --exe ../fixtures/spu_tone.exe --frames 60 --png 60:spu-tone-runner60.png
          test -d ../ra-spu-tone/system && test -z "$(find ../ra-spu-tone/system -mindepth 1 -print -quit)"
          for f in spu-tone-runner59 spu-tone-runner60 spu-tone.59 spu-tone.60; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          python3 ../../tests/retroarch/verify.py compare spu-tone-runner59.bmp spu-tone.59.bmp 256 240
          python3 ../../tests/retroarch/verify.py compare spu-tone-runner60.bmp spu-tone.60.bmp 256 240
      - name: RetroArch boots the owned disc
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra-disc"
          "-DSHOT=$PWD/build/frames/disc.png" -DSYSTEM_BIOS=build/ci/openbios/openbios-fast.bin
          -DCONTENT=build/ci/fixtures/disc_boot.cue -DFRAMES=900
          -P tests/retroarch/run_retroarch.cmake
      - name: The disc screenshot equals the runner's frame
        working-directory: build/frames
        run: |
          ../runner/bin/schwaystation-run --bios ../ci/openbios/openbios-fast.bin --disc ../ci/fixtures/disc_boot.cue \
            --frames 900 --png 900:disc-runner.png
          for f in disc-runner disc; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          # The owned disc guest exposes its 16x16 native RGB24 frame here.
          python3 ../../tests/retroarch/verify.py compare disc-runner.bmp disc.bmp 16 16
      - name: RetroArch logs
        if: failure()
        run: cat build/ra/*.log build/ra-replay/*.log build/ra-spu-tone/*.log build/ra-disc/*.log build/ra-cards/*.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retroarch-replay-probe
          path: |
            build/ra-replay/probe.bsv
            build/ra-replay/*.log
            build/ra-replay/probe.cross.bsv
            build/ra-spu-tone/*.log
            build/ra-disc/*.log
            build/ra-cards/*.log
          retention-days: 1
          if-no-files-found: ignore
      # Captures from both comparisons aid diagnosis.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retroarch-frames
          path: build/frames/*.png
          retention-days: 1
          if-no-files-found: ignore

  # Cachegrind instructions per frame of the test card and gpu_motion: the
  # pull request's head commit against its merge base with the base branch,
  # the base measured twice. The merge commit's first parent is not used: it
  # is the base branch tip, which also counts commits that landed after the
  # branch point. Direct runs only (a nested call passes ref). Manual runs
  # measure only when control_ref supplies a comparison commit.
  perf:
    needs: changes
    if: ${{ !inputs.ref && needs.changes.outputs.heavy == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.control_ref != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # 10-minute allowance; run 44600162797 spent 5 min installing valgrind before timeout; last successful total was 108 s in run 44218206100, provisional
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      EVENT: ${{ github.event_name }}
      CONTROL_REF: ${{ inputs.control_ref || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Cachegrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      # Both runners are copied to paths of equal length, so the path
      # Cachegrind and the loader see costs the same instructions. NO_BASE is
      # decided from the base tree's contents only: a base that has the perf
      # preset and fails to build fails this step.
      - name: Build the runner at head and base
        id: build
        run: |
          cmake --preset ci
          cmake --build build/ci --target fixtures/gpu_motion.exe schwaystation-test-run
          mkdir -p "$RUNNER_TEMP/perf"
          cp build/ci/fixtures/gpu_motion.exe "$RUNNER_TEMP/perf/gpu_motion.exe"
          build() {
            (cd "$1" && cmake --workflow --preset perf) || return 1
            mkdir -p "$2" && cp "$1/build/perf/schwaystation-run" "$2/schwaystation-run" && \
              cp "$RUNNER_TEMP/perf/gpu_motion.exe" "$2/gpu_motion.exe"
          }
          build . "$RUNNER_TEMP/perf/head"
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$CONTROL_REF" ]; then
              echo no_base=none >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ! "$CONTROL_REF" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${CONTROL_REF}^{commit}"; then
              echo "perf: control_ref must be a full commit SHA available in this checkout" >&2
              exit 2
            fi
            git worktree add --detach "$RUNNER_TEMP/base" "$CONTROL_REF"
            build "$RUNNER_TEMP/base" "$RUNNER_TEMP/perf/base"
            echo no_base=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          echo "perf: head $HEAD_SHA, merge base $base"
          if git show "$base:CMakePresets.json" 2> /dev/null | grep -q '"name": "perf"'; then
            git worktree add --detach "$RUNNER_TEMP/base" "$base"
            build "$RUNNER_TEMP/base" "$RUNNER_TEMP/perf/base"
            echo no_base=false >> "$GITHUB_OUTPUT"
          else
            echo "perf: merge base $base has no perf preset; verdict NO_BASE"
            echo no_base=true >> "$GITHUB_OUTPUT"
          fi
      - name: Instructions per frame
        env:
          NO_BASE: ${{ steps.build.outputs.no_base }}
        run: |
          valgrind=$(command -v valgrind)
          # Ir of one runner/workload combination for the requested frames,
          # from Cachegrind's summary line; empty output is a failure.
          ir() {
            rm -f "$RUNNER_TEMP/cg.out"
            local args=(--frames "$3")
            if [ "$2" = gpu_motion ]; then
              args=(--exe "$1/gpu_motion.exe" --frames "$3")
            fi
            env -i "$valgrind" --tool=cachegrind --cache-sim=no --cachegrind-out-file="$RUNNER_TEMP/cg.out" \
              "$1/schwaystation-run" "${args[@]}" > /dev/null 2>&1 || return 1
            local v
            v=$(sed -n 's/^summary: *\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/cg.out")
            [ -n "$v" ] || return 1
            echo "$v"
          }
          # Keep testcard's established window; gpu_motion uses a 50-frame window for Cachegrind.
          per_frame() {
            local start=60 end=360 a b
            if [ "$2" = gpu_motion ]; then
              start=10
              end=60
            fi
            a=$(ir "$1" "$2" "$start") || return 1
            b=$(ir "$1" "$2" "$end") || return 1
            echo $(( (b - a) / (end - start) ))
          }
          if [ "$NO_BASE" = none ]; then
            for fixture in testcard gpu_motion; do
              control=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
              control2=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
              control3=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
              max=$control min=$control
              for v in "$control2" "$control3"; do
                if [ "$v" -gt "$max" ]; then max=$v; fi
                if [ "$v" -lt "$min" ]; then min=$v; fi
              done
              line="perf control $fixture runs=$control,$control2,$control3 spread=$((max - min))"
              echo "$line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 0
          fi
          fixtures=(testcard gpu_motion)
          rc=0
          for fixture in "${fixtures[@]}"; do
            # QUALITY_PERF_COMPARE_BEGIN
            head=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
            cmake "-DQUALITY=${QUALITY_FILE:-quality.json}" "-DMETRIC=ir_per_frame.$fixture" "-DMEASURED=$head" -P tests/cmake/quality.cmake || rc=$?
            # QUALITY_PERF_COMPARE_END
            base1='' base2=''
            if [ "$NO_BASE" = false ]; then
              base1=$(per_frame "$RUNNER_TEMP/perf/base" "$fixture") || exit 1
              base2=$(per_frame "$RUNNER_TEMP/perf/base" "$fixture") || exit 1
            fi
            cmake "-DFIXTURE=$fixture" "-DHEAD=$head" "-DBASE1=$base1" "-DBASE2=$base2" -DALLOW=tests/perf/allow.txt \
              "-DTODAY=$(date -u +%Y-%m-%d)" "-DNO_BASE=$NO_BASE" \
              -P tests/cmake/perf_compare.cmake > perf.txt 2>&1 || rc=$?
            cat perf.txt
            grep '^perf ' perf.txt >> "$GITHUB_STEP_SUMMARY" || true
          done
          spu_rc=0
          cmake "-DVALGRIND=$valgrind" \
            "-DUNIT=$GITHUB_WORKSPACE/build/ci/tests/schwaystation-test-run" \
            "-DOUT=$RUNNER_TEMP/perf/spu_idle" -DCASE=spu_idle \
            -P tests/perf/tests.cmake || spu_rc=$?
          cd_rc=0
          cmake "-DVALGRIND=$valgrind" \
            "-DUNIT=$GITHUB_WORKSPACE/build/ci/tests/schwaystation-test-run" \
            "-DOUT=$RUNNER_TEMP/perf/cd_idle" -DCASE=cd_idle \
            -P tests/perf/tests.cmake || cd_rc=$?
          if [ "$rc" -ne 0 ] || [ "$spu_rc" -ne 0 ] || [ "$cd_rc" -ne 0 ]; then exit 1; fi

  # Every publish step of a release, rehearsed with the release App's token on
  # a same-repository pull request that changes a release input, against a
  # prerelease that is never latest: the 18 archives the build legs made from
  # the merge commit, SHA256SUMS, attestations that verify and a tampered copy
  # that does not, then the published release downloaded and checked. Direct
  # runs only (a nested call passes ref). A fork's pull request has no secrets
  # and skips it. docs/maintaining.md describes the rehearsal.
  rehearsal:
    needs: [changes, build]
    if: >-
      github.event_name == 'pull_request' && !inputs.ref &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.release_inputs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 13  # provisional; 0 comparable samples, use the next ordinary successful or failed attempt.
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      # The merge commit the build legs checked out and recorded.
      EXPECTED_SHA: ${{ github.sha }}
      # The ref a pull_request run attests from, so a rehearsal's attestation
      # never passes for a release's; its signer is this file, not release.yml.
      SOURCE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
      SIGNER_WORKFLOW: ci.yml
    steps:
      - name: The release App is configured
        env:
          CLIENT_ID: ${{ vars.SCHWAYSTATION_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.SCHWAYSTATION_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "rehearsal: the release App is not configured: set SCHWAYSTATION_APP_CLIENT_ID and SCHWAYSTATION_APP_PRIVATE_KEY (docs/maintaining.md)"
            exit 1
          fi
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCHWAYSTATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHWAYSTATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: artifacts
      # The zips side by side in dist, each leg's commit.txt under dist/legs/N.
      - name: The archives and each leg's commit
        run: |
          mkdir -p dist
          n=0
          for leg in artifacts/archives-*/; do
            n=$((n + 1))
            mkdir -p "dist/legs/$n"
            mv "${leg}commit.txt" "dist/legs/$n/"
            mv "$leg"schwaystation-*.zip dist/
          done
      - run: sh scripts/publish.sh prepare dist
      - id: draft
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(sh scripts/publish.sh rehearsal-create "$REHEARSAL_TAG")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: sh scripts/publish.sh upload "$REHEARSAL_TAG" "$ID" dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --prerelease --latest=false
      # would, but without looking the draft up by its tag.
      - name: Publish as a prerelease that is never latest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=true -f make_latest=false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: sh scripts/publish.sh verify "$REHEARSAL_TAG" dist

  # Last, whatever the rehearsal did: its release and its tag go. A run
  # cancelled by a newer push can leave one uniquely named prerelease.
  cleanup:
    needs: rehearsal
    if: always() && needs.rehearsal.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; provisional, 0 comparable samples; use the next ordinary successful or failed attempt.
    permissions:
      contents: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCHWAYSTATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHWAYSTATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ needs.rehearsal.outputs.id }}
        run: sh scripts/publish.sh rehearsal-delete "$REHEARSAL_TAG" ${ID:+"$ID"}

  # The one required check. GitHub reports a skipped job as success and skips
  # a job whose dependency failed, so this always runs and requires every
  # result to be success, except: a heavy job skipped when changes said
  # heavy=false; title, perf, rehearsal and cleanup skipped outside pull
  # requests; perf, rehearsal and cleanup skipped in a nested call that
  # passes ref (release.yml's); and rehearsal and cleanup skipped when no
  # release input changed.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, hygiene, title, gpu-reference, openbios, build, asan, nofp, be32, wasm32, hash-equality, retroarch, perf, rehearsal, cleanup]
    runs-on: ubuntu-26.04
    timeout-minutes: 1  # 1-minute setup floor; 2 x 3 s (2 samples); [run 44337684558](https://github.com/szTheory/schwaystation/actions/runs/44337684558), provisional
    permissions:
      actions: read
      contents: read
    steps:
      - name: Every job succeeded or was skipped as allowed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          CALLED: ${{ inputs.ref && 'true' || 'false' }}
          RELEASE_INPUTS: ${{ needs.changes.outputs.release_inputs }}
        run: |
          # QUALITY_CI_ROLLUP_BEGIN
          set -e
          echo "$NEEDS" | jq -e --arg event "$EVENT" --arg heavy "$HEAVY" --arg called "$CALLED" --arg release_inputs "$RELEASE_INPUTS" 'to_entries | all(
            .value.result == "success"
            or (.key == "title" and .value.result == "skipped" and $event != "pull_request")
            or (.key == "perf" and .value.result == "skipped" and ($event != "pull_request" or $called == "true"))
            or ((.key | IN("rehearsal", "cleanup")) and .value.result == "skipped"
              and ($release_inputs != "true" or $event != "pull_request" or $called == "true"))
            or ($heavy == "false" and .value.result == "skipped" and (.key | IN("changes", "hygiene", "title") | not)))'
          # QUALITY_CI_ROLLUP_END
      - name: Checkout exact CI revision
        if: github.event_name == 'pull_request' && needs.changes.outputs.heavy == 'true' && !inputs.ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare current-attempt critical path
        if: github.event_name == 'pull_request' && needs.changes.outputs.heavy == 'true' && !inputs.ref
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAVY: ${{ needs.changes.outputs.heavy }}
          CI_CALLED: ${{ inputs.ref && 'true' || 'false' }}
          CI_RELEASE_INPUTS: ${{ needs.changes.outputs.release_inputs }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_FILE: quality.json
        run: |
          # QUALITY_CI_TIMING_BEGIN
          set -eu
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          jobs_file="$RUNNER_TEMP/ci-jobs-pages.json"
          complete=false
          for attempt in 1 2; do
            if gh api --paginate --slurp "$endpoint" > "$jobs_file" &&
              jq -e 'type == "array" and length > 0 and (.[0].total_count as $total | ($total | type == "number") and all(.[]; .total_count == $total and (.jobs | type == "array")) and ([.[].jobs[]] | length == $total))' "$jobs_file" >/dev/null; then
              complete=true
              break
            fi
            [ "$attempt" -eq 2 ] || sleep 2
          done
          [ "$complete" = true ] || { echo "Actions attempt jobs are incomplete after the bounded consistency retry" >&2; exit 1; }
          CI_JOBS_FILE="$jobs_file" scripts/ci-critical-path.sh
          # QUALITY_CI_TIMING_END
