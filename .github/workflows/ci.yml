# Continuous integration. Build jobs use the local CMake workflows and check that every
# expected test ran. The GPU reference lane configures only its selected GPU tests.
# The ruleset requires one check, `CI required`; docs/testing.md describes the jobs.
# Every timeout below is provisional until this repository's own runs measure it.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      control_ref:
        description: "Optional commit with which to compare GPU-motion performance"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit to build; empty builds the caller's commit"
        type: string
        required: false
        default: ""

# No trigger-level path filter: a workflow skipped by paths leaves the
# required check pending. The changes job decides what runs instead.

permissions:
  contents: read

# Armed after zero-spread controls on the v0.1.0 commit, runs 40939706087 and
# 40939709809. Pull requests fail above +1.00 % per fixture.
env:
  SCHWAYSTATION_PERF_MODE: gate
  # A published and deleted tag name can never be reused under immutable
  # releases, so every rehearsal attempt gets its own.
  REHEARSAL_TAG: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

# Only a pull request's runs supersede each other, so every main commit keeps
# a result. The workflow name is part of the group because a call from
# release.yml sees the caller's context: its run must not queue behind the
# push run on the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # heavy=false only for a pull request whose every changed path, old and new
  # name, is under .planning/; then the heavy jobs are skipped.
  # release_inputs=true when a path the release pipeline reads changed.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 17 s (changes), slowest of 1 run, run 39455724329, provisional
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      release_inputs: ${{ steps.classify.outputs.release_inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      # A failed listing adds a path outside .planning/, so it counts as heavy;
      # CHANGED catches a listing cut short at the API's 3000 files.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ -z "$NUMBER" ]; then
            printf 'heavy=true\nrelease_inputs=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          { gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' || echo '(listing failed)'; } |
            sh scripts/classify-changes.sh "$CHANGED" | tee -a "$GITHUB_OUTPUT"

  # Required renderer oracle: fetch the pinned captures and three source logs,
  # then run only the GPU reference tests. The CPU vector corpus stays nightly.
  gpu-reference:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # provisional until the merged plan's hosted run measures the lane.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Configure the GPU reference inventory
        run: >-
          cmake -S . -B build/gpu-reference -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DSCHWAYSTATION_INVENTORY=nightly -DSCHWAYSTATION_FIXTURES=OFF
          -DSCHWAYSTATION_GPU_REFERENCE_ONLY=ON
      - name: Build the runner and GPU judge
        run: cmake --build build/gpu-reference --target schwaystation-run schwaystation-test-gpu-reference --parallel 2
      - name: Run the pinned GPU oracles
        run: >-
          ctest --test-dir build/gpu-reference --output-on-failure --no-tests=error
          --output-junit junit.xml -R '^gpu[.]reference[.]'
      - name: Every GPU reference ran
        run: >-
          cmake -DJUNIT=build/gpu-reference/junit.xml -DINVENTORY=tests/inventory/nightly.txt
          -DLABELS=gpu -P tests/cmake/check_junit.cmake

  # Build once in this run, then hand the digest-checked image to every build
  # consumer through a short-retention Actions artifact (never a cache).
  openbios:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 8  # 8-minute provisional bound until the producer has measured runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Build and verify pinned OpenBIOS
        env:
          OPENBIOS_PIN: 9db6d88d23c4da7a39b1a4b9729f1e5fff80dec9
        run: |
          set -eu
          source_dir="$RUNNER_TEMP/nugget"
          archive_dir="$RUNNER_TEMP/openbios-archive"
          toolchain_dir="$RUNNER_TEMP/openbios-toolchain"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/pcsx-redux/nugget.git "$source_dir"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$OPENBIOS_PIN"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$OPENBIOS_PIN"
          mkdir -p "$archive_dir" "$toolchain_dir" build/openbios
          sh scripts/fetch-pin.sh gcc-mipsel-none-elf-linux "$archive_dir"
          toolchain_zip=$(find "$archive_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$toolchain_zip"
          unzip -t "$toolchain_zip" > /dev/null
          unzip -q "$toolchain_zip" -d "$toolchain_dir"
          test -x "$toolchain_dir/bin/mipsel-none-elf-gcc"
          PATH="$toolchain_dir/bin:$PATH" make -C "$source_dir/openbios" -j2 \
            BUILD=Release BOARD=psx BOOT=rom OPENBIOS_SHELL=shell
          cmake "-DOPENBIOS_INPUT=$source_dir/openbios/openbios.bin" \
            -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
          cp "$source_dir/openbios/openbios.bin" build/openbios/openbios.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openbios-handoff
          path: build/openbios/openbios.bin
          retention-days: 1
          if-no-files-found: error

  # The image has git and jq; configure finds them.
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 2  # 2 x 31 s (hygiene), slowest of 5 runs, run 42725764966
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset hygiene
      - name: Every test ran
        run: cmake -DJUNIT=build/hygiene/junit.xml -DINVENTORY=tests/inventory/hygiene.txt -P tests/cmake/check_junit.cmake

  # The squash commit takes the pull request's title and body, so the check
  # reads them live: an edit reruns it (the edited trigger) without a commit.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 7 s (title), slowest of 1 run, run 39455724329, provisional
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - name: Conventional Commit title, no skip token
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            sh scripts/check-title.sh "$title"

  build:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 11  # 2 x 311 s (windows-x64 build), slowest of 5 runs across the six legs, run 42725764966
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, preset: ci, os: linux, arch: x64 }
          - { runner: ubuntu-26.04-arm, preset: ci, os: linux, arch: arm64 }
          - { runner: macos-15, preset: ci, os: macos, arch: arm64 }
          - { runner: macos-15-intel, preset: ci, os: macos, arch: x64 }
          - { runner: windows-2025, preset: ci-msvc, os: windows, arch: x64 }
          - { runner: windows-11-arm, preset: ci-msvc, os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: compat-base
          sparse-checkout: |
            scripts/compat-ratchet.sh
            tests/cmake/compat-ratchet.cmake
            tests/compat/ledger.csv
          sparse-checkout-cone-mode: false
      - name: Preserve protected base checkout for ratchet
        if: github.event_name == 'pull_request'
        env:
          COMPAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          protected_base="$RUNNER_TEMP/compat-base"
          cmake -E copy_directory "$GITHUB_WORKSPACE/compat-base" "$protected_base"
          test "$(git -C "$protected_base" rev-parse --verify HEAD)" = "$COMPAT_BASE_SHA"
          printf 'COMPAT_BASE_DIR=%s\n' "$protected_base" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/${{ matrix.preset }}/openbios
      - name: Verify run-local OpenBIOS before consumers
        run: >-
          cmake -DOPENBIOS_INPUT=build/${{ matrix.preset }}/openbios/openbios.bin
          -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
      # The MSVC developer environment for the runner's own architecture,
      # without a third-party action.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV } }
      - name: Build, test, package
        env:
          COMPAT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DEXCLUDE=release -P tests/cmake/check_junit.cmake
      - name: Every release test ran
        run: >-
          cmake -DJUNIT=build/${{ matrix.preset }}/junit-release.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=release -P tests/cmake/check_junit.cmake
      # The README line installs this leg's own libretro zip after checking
      # its checksum, and refuses a copy with one byte flipped.
      - name: README install line
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        run: |
          cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -P tests/cmake/install_line.cmake
          cmake -DREADME=README.md "-DBASE_URL=file://$PWD/build/ci/" -DFLIP=1 -P tests/cmake/install_line.cmake
      # The commit these archives were built from; a release publishes only
      # archives that all record its own commit.
      - name: The commit built
        run: git rev-parse HEAD > build/${{ matrix.preset }}/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.preset }}/schwaystation-*.zip
            build/${{ matrix.preset }}/commit.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/hashes.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        with:
          name: pad-counter-fixture
          path: build/${{ matrix.preset }}/fixtures/pad_counter.exe
          retention-days: 1
          if-no-files-found: error

  asan:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 9  # Measured: run 43317211769 passed 405/405 in 4m06; movies took 2m32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/asan/openbios
      - name: Verify run-local OpenBIOS before consumers
        run: cmake -DOPENBIOS_INPUT=build/asan/openbios/openbios.bin -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
      # clang-21 is on the image; its sanitizer runtimes may not be.
      - name: Sanitizer runtimes
        run: dpkg -s libclang-rt-21-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libclang-rt-21-dev; }
      - run: cmake --workflow --preset asan
      # The abi and release checks read binary shapes the instrumentation changes.
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/asan/junit.xml -DINVENTORY=tests/inventory/asan.txt
          "-DEXCLUDE=abi|release" -P tests/cmake/check_junit.cmake

  nofp:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: nofp (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3  # floor covers slow checkout/image startup; one-minute cancellations: runs 42840838785 and 42841474140
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - run: cmake --workflow --preset nofp
      - name: Every test ran
        run: cmake -DJUNIT=build/nofp/junit.xml -DINVENTORY=tests/inventory/nofp.txt -P tests/cmake/check_junit.cmake

  # 32-bit big-endian PowerPC under qemu-ppc: label portable, and its
  # hashes.txt joins the comparison.
  be32:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45  # Provisional: run 43317211769 hit 25m at input.movies +15m03; CTest allows 240s x8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/be32/openbios
      - name: Verify run-local OpenBIOS before consumers
        run: cmake -DOPENBIOS_INPUT=build/be32/openbios/openbios.bin -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
      - name: Cross compiler and qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu g++-powerpc-linux-gnu qemu-user
      - run: cmake --workflow --preset be32
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/be32/junit.xml -DINVENTORY=tests/inventory/ci.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-be32
          path: build/be32/hashes.txt
          if-no-files-found: error

  # The same inputs give the same hashes everywhere: exactly eight files, the
  # six build legs, be32 and wasm32, byte-identical.
  hash-equality:
    needs: [changes, build, be32, wasm32]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor; 2 x 5 s (hash-equality), slowest of 1 run, run 39455724329, provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          path: hashes
      - name: Hashes are byte-identical
        run: |
          files=$(printf '%s;' hashes/*/hashes.txt)
          cmake "-DFILES=${files%;}" -DCOUNT=8 -DMODE=compare -P tests/cmake/hashes.cmake

  # The WebAssembly lane participates in the same required hash comparison.
  wasm32:
    needs: [changes, openbios]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (apt); 2 x 60 s (wasm32), slowest of 5 runs, run 42691517611
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openbios-handoff
          path: build/wasm32/openbios
      - name: Verify run-local OpenBIOS before consumers
        run: cmake -DOPENBIOS_INPUT=build/wasm32/openbios/openbios.bin -DEXPECTED_FILE=tests/built/expected.txt -P cmake/OpenBIOS.cmake
      - name: WASI sysroot and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wasi-libc libclang-rt-21-dev-wasm32
          scripts/fetch-pin.sh wasmtime-x86_64-linux build/pins/wasmtime
      - run: cmake --workflow --preset wasm32
      - name: Every test ran
        run: >-
          cmake -DJUNIT=build/wasm32/junit.xml -DINVENTORY=tests/inventory/wasm32.txt
          -DLABELS=portable -P tests/cmake/check_junit.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-wasm32
          path: build/wasm32/hashes.txt
          if-no-files-found: error

  # A real frontend shows the same frame the runner hashes: RetroArch from
  # the pinned DMG runs the built core with no content for 5 frames, and its
  # screenshot, decoded by sips, equals the runner's frame 5 pixel for pixel
  # at 320x240. A CI step, not a CTest, so nothing skips itself off macOS.
  # The runner's frame number stays equal to RetroArch's frame count; if a
  # run ever shows a fixed one-frame offset, read the frame counter in the
  # uploaded screenshot and pin the runner's number here with a comment
  # saying so. A range of frames is never accepted.
  retroarch:
    needs: [changes, build]
    # Keep the host result when another build leg fails; the required aggregate still fails.
    if: ${{ !cancelled() && needs.changes.outputs.heavy == 'true' }}
    runs-on: macos-15
    timeout-minutes: 5  # 5-minute floor; 2 x 23 s (retroarch), slowest of 1 run, run 39455724329, provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives-macos-arm64
          path: build/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pad-counter-fixture
          path: build/fixtures
      - name: Core and runner from the build
        run: |
          unzip -q build/archives/schwaystation-libretro-macos-arm64.zip -d build/libretro
          unzip -q build/archives/schwaystation-runner-macos-arm64.zip -d build/runner
      # fetch-pin.sh checks the DMG's SHA-256 before anything opens it.
      - name: RetroArch 1.22.2 from the pinned DMG
        run: |
          scripts/fetch-pin.sh retroarch-dmg build/dmg
          hdiutil attach build/dmg/RetroArch_Metal.dmg -nobrowse -readonly -mountpoint build/mount
          ditto build/mount/RetroArch.app build/RetroArch.app
          hdiutil detach build/mount
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/RetroArch.app/Contents/Info.plist)
          echo "RetroArch $version"
          test "$version" = 1.22.2
      - name: RetroArch runs the core with no content
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra" -DFRAMES=5
          "-DSHOT=$PWD/build/frames/shot.png" -P tests/retroarch/run_retroarch.cmake
      - name: The screenshot equals the runner's frame
        working-directory: build/frames
        run: |
          ../runner/bin/schwaystation-run --frames 5 --png 5:runner.png
          for f in runner shot; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          python3 ../../tests/retroarch/verify.py compare runner.bmp shot.bmp 320 240
          python3 ../../tests/retroarch/verify.py pixel-control shot.bmp 7 3
          python3 ../../tests/retroarch/verify.py dimension-control shot.bmp 319 240
      - name: Record and replay deterministic Cross input
        run: >-
          cmake -DRETROARCH=build/RetroArch.app/Contents/MacOS/RetroArch
          -DCORE=build/libretro/cores/schwaystation_libretro.dylib -DINFO=build/libretro/info/schwaystation_libretro.info
          -DTEMPLATE=tests/retroarch/test.cfg.in "-DRA_DIR=$PWD/build/ra-replay"
          "-DSHOT=$PWD/build/frames/replay" -DPROBE_CONTENT=build/fixtures/pad_counter.exe -DFRAMES=60
          -DVERIFY=tests/retroarch/verify.py -P tests/retroarch/run_retroarch.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retroarch-replay-probe
          path: |
            build/ra-replay/probe.bsv
            build/ra-replay/*.log
            build/ra-replay/probe.cross.bsv
          retention-days: 1
          if-no-files-found: ignore
      - name: Both RetroArch frames equal their runner references
        working-directory: build/frames
        run: |
          printf '%s\n' '1 p1=digital:.:128,128,128,128 p2=.' \
            '60 p1=digital:X:128,128,128,128 p2=.' > pad-counter.inputs
          ../runner/bin/schwaystation-run --exe ../fixtures/pad_counter.exe --frames 59 \
            --inputs pad-counter.inputs --png 59:runner59.png
          ../runner/bin/schwaystation-run --exe ../fixtures/pad_counter.exe --frames 60 \
            --inputs pad-counter.inputs --png 60:runner60.png
          test -d ../ra-replay/system && test -z "$(find ../ra-replay/system -mindepth 1 -print -quit)"
          for f in runner59 runner60 replay.59 replay.60; do
            sips --deleteColorManagementProperties "$f.png" > /dev/null
            sips -s format bmp "$f.png" --out "$f.bmp" > /dev/null
          done
          python3 ../../tests/retroarch/verify.py compare runner59.bmp replay.59.bmp 256 240
          python3 ../../tests/retroarch/verify.py compare runner60.bmp replay.60.bmp 256 240
          python3 ../../tests/retroarch/verify.py distinct replay.59.bmp replay.60.bmp
      - name: RetroArch logs
        if: failure()
        run: cat build/ra/*.log build/ra-replay/*.log || true
      # Captures from both comparisons aid diagnosis.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retroarch-frames
          path: build/frames/*.png
          retention-days: 1
          if-no-files-found: ignore

  # Cachegrind instructions per frame of the test card and gpu_motion: the
  # pull request's head commit against its merge base with the base branch,
  # the base measured twice. The merge commit's first parent is not used: it
  # is the base branch tip, which also counts commits that landed after the
  # branch point. Direct runs only (a nested call passes ref). A manual run
  # without control_ref measures both fixtures three times; with control_ref
  # it compares gpu_motion with that exact commit.
  perf:
    needs: changes
    if: ${{ !inputs.ref && needs.changes.outputs.heavy == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (apt); perf took 1m15 and 1m39 in runs 42984345515 and 42985306022, provisional
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      EVENT: ${{ github.event_name }}
      CONTROL_REF: ${{ inputs.control_ref || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Cachegrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      # Both runners are copied to paths of equal length, so the path
      # Cachegrind and the loader see costs the same instructions. NO_BASE is
      # decided from the base tree's contents only: a base that has the perf
      # preset and fails to build fails this step.
      - name: Build the runner at head and base
        id: build
        run: |
          cmake --preset ci
          cmake --build build/ci --target fixtures/gpu_motion.exe
          mkdir -p "$RUNNER_TEMP/perf"
          cp build/ci/fixtures/gpu_motion.exe "$RUNNER_TEMP/perf/gpu_motion.exe"
          build() {
            (cd "$1" && cmake --workflow --preset perf) || return 1
            mkdir -p "$2" && cp "$1/build/perf/schwaystation-run" "$2/schwaystation-run" && \
              cp "$RUNNER_TEMP/perf/gpu_motion.exe" "$2/gpu_motion.exe"
          }
          build . "$RUNNER_TEMP/perf/head"
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$CONTROL_REF" ]; then
              echo no_base=none >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ! "$CONTROL_REF" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${CONTROL_REF}^{commit}"; then
              echo "perf: control_ref must be a full commit SHA available in this checkout" >&2
              exit 2
            fi
            git worktree add --detach "$RUNNER_TEMP/base" "$CONTROL_REF"
            build "$RUNNER_TEMP/base" "$RUNNER_TEMP/perf/base"
            echo no_base=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          echo "perf: head $HEAD_SHA, merge base $base"
          if git show "$base:CMakePresets.json" 2> /dev/null | grep -q '"name": "perf"'; then
            git worktree add --detach "$RUNNER_TEMP/base" "$base"
            build "$RUNNER_TEMP/base" "$RUNNER_TEMP/perf/base"
            echo no_base=false >> "$GITHUB_OUTPUT"
          else
            echo "perf: merge base $base has no perf preset; verdict NO_BASE"
            echo no_base=true >> "$GITHUB_OUTPUT"
          fi
      - name: Instructions per frame
        env:
          NO_BASE: ${{ steps.build.outputs.no_base }}
        run: |
          valgrind=$(command -v valgrind)
          # Ir of one runner/workload combination for the requested frames,
          # from Cachegrind's summary line; empty output is a failure.
          ir() {
            rm -f "$RUNNER_TEMP/cg.out"
            local args=(--frames "$3")
            if [ "$2" = gpu_motion ]; then
              args=(--exe "$1/gpu_motion.exe" --frames "$3")
            fi
            env -i "$valgrind" --tool=cachegrind --cache-sim=no --cachegrind-out-file="$RUNNER_TEMP/cg.out" \
              "$1/schwaystation-run" "${args[@]}" > /dev/null 2>&1 || return 1
            local v
            v=$(sed -n 's/^summary: *\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/cg.out")
            [ -n "$v" ] || return 1
            echo "$v"
          }
          # Keep testcard's established window; gpu_motion uses a 50-frame window for Cachegrind.
          per_frame() {
            local start=60 end=360 a b
            if [ "$2" = gpu_motion ]; then
              start=10
              end=60
            fi
            a=$(ir "$1" "$2" "$start") || return 1
            b=$(ir "$1" "$2" "$end") || return 1
            echo $(( (b - a) / (end - start) ))
          }
          if [ "$NO_BASE" = none ]; then
            for fixture in testcard gpu_motion; do
              control=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
              control2=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
              control3=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
              max=$control min=$control
              for v in "$control2" "$control3"; do
                if [ "$v" -gt "$max" ]; then max=$v; fi
                if [ "$v" -lt "$min" ]; then min=$v; fi
              done
              line="perf control $fixture runs=$control,$control2,$control3 spread=$((max - min))"
              echo "$line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 0
          fi
          fixtures=(testcard gpu_motion)
          rc=0
          for fixture in "${fixtures[@]}"; do
            head=$(per_frame "$RUNNER_TEMP/perf/head" "$fixture") || exit 1
            base1='' base2=''
            if [ "$NO_BASE" = false ]; then
              base1=$(per_frame "$RUNNER_TEMP/perf/base" "$fixture") || exit 1
              base2=$(per_frame "$RUNNER_TEMP/perf/base" "$fixture") || exit 1
            fi
            cmake "-DFIXTURE=$fixture" "-DHEAD=$head" "-DBASE1=$base1" "-DBASE2=$base2" -DALLOW=tests/perf/allow.txt \
              "-DTODAY=$(date -u +%Y-%m-%d)" "-DNO_BASE=$NO_BASE" \
              -P tests/cmake/perf_compare.cmake > perf.txt 2>&1 || rc=$?
            cat perf.txt
            grep '^perf ' perf.txt >> "$GITHUB_STEP_SUMMARY" || true
          done
          exit "$rc"

  # Every publish step of a release, rehearsed with the release App's token on
  # a same-repository pull request that changes a release input, against a
  # prerelease that is never latest: the 18 archives the build legs made from
  # the merge commit, SHA256SUMS, attestations that verify and a tampered copy
  # that does not, then the published release downloaded and checked. Direct
  # runs only (a nested call passes ref). A fork's pull request has no secrets
  # and skips it. docs/maintaining.md describes the rehearsal.
  rehearsal:
    needs: [changes, build]
    if: >-
      github.event_name == 'pull_request' && !inputs.ref &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.release_inputs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 13  # 2 x 386 s (rehearsal), slowest of 5 runs, run 42691517611
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      # The merge commit the build legs checked out and recorded.
      EXPECTED_SHA: ${{ github.sha }}
      # The ref a pull_request run attests from, so a rehearsal's attestation
      # never passes for a release's; its signer is this file, not release.yml.
      SOURCE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
      SIGNER_WORKFLOW: ci.yml
    steps:
      - name: The release App is configured
        env:
          CLIENT_ID: ${{ vars.SCHWAYSTATION_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.SCHWAYSTATION_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "rehearsal: the release App is not configured: set SCHWAYSTATION_APP_CLIENT_ID and SCHWAYSTATION_APP_PRIVATE_KEY (docs/maintaining.md)"
            exit 1
          fi
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCHWAYSTATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHWAYSTATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: artifacts
      # The zips side by side in dist, each leg's commit.txt under dist/legs/N.
      - name: The archives and each leg's commit
        run: |
          mkdir -p dist
          n=0
          for leg in artifacts/archives-*/; do
            n=$((n + 1))
            mkdir -p "dist/legs/$n"
            mv "${leg}commit.txt" "dist/legs/$n/"
            mv "$leg"schwaystation-*.zip dist/
          done
      - run: sh scripts/publish.sh prepare dist
      - id: draft
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(sh scripts/publish.sh rehearsal-create "$REHEARSAL_TAG")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: sh scripts/publish.sh upload "$REHEARSAL_TAG" "$ID" dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: sh scripts/publish.sh attested dist
      # By ID, as gh release edit --draft=false --prerelease --latest=false
      # would, but without looking the draft up by its tag.
      - name: Publish as a prerelease that is never latest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -F prerelease=true -f make_latest=false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: sh scripts/publish.sh verify "$REHEARSAL_TAG" dist

  # Last, whatever the rehearsal did: its release and its tag go. A run
  # cancelled by a newer push can leave one uniquely named prerelease.
  cleanup:
    needs: rehearsal
    if: always() && needs.rehearsal.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (API); 2 x 9 s (cleanup), slowest of 1 run, run 39455724329, provisional
    permissions:
      contents: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCHWAYSTATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHWAYSTATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ID: ${{ needs.rehearsal.outputs.id }}
        run: sh scripts/publish.sh rehearsal-delete "$REHEARSAL_TAG" ${ID:+"$ID"}

  # The one required check. GitHub reports a skipped job as success and skips
  # a job whose dependency failed, so this always runs and requires every
  # result to be success, except: a heavy job skipped when changes said
  # heavy=false; title, perf, rehearsal and cleanup skipped outside pull
  # requests; perf, rehearsal and cleanup skipped in a nested call that
  # passes ref (release.yml's); and rehearsal and cleanup skipped when no
  # release input changed.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, hygiene, title, gpu-reference, build, asan, nofp, be32, wasm32, hash-equality, retroarch, perf, rehearsal, cleanup]
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # 5-minute floor (roll-up); 2 x 4 s (CI required), slowest of 1 run, run 39455724329, provisional
    steps:
      - name: Every job succeeded or was skipped as allowed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          CALLED: ${{ inputs.ref && 'true' || 'false' }}
          RELEASE_INPUTS: ${{ needs.changes.outputs.release_inputs }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" --arg heavy "$HEAVY" --arg called "$CALLED" --arg release_inputs "$RELEASE_INPUTS" 'to_entries | all(
            .value.result == "success"
            or (.key == "title" and .value.result == "skipped" and $event != "pull_request")
            or (.key == "perf" and .value.result == "skipped" and ($event != "pull_request" or $called == "true"))
            or ((.key | IN("rehearsal", "cleanup")) and .value.result == "skipped"
              and ($release_inputs != "true" or $event != "pull_request" or $called == "true"))
            or ($heavy == "false" and .value.result == "skipped" and (.key | IN("changes", "hygiene", "title") | not)))'
